<!DOCTYPE html>
<html>
<head>

    <title>All 4 Navbar Designs</title>

    <style>

        /* =========================
           NAVBAR 1 - SHADCNBLOCKS
        ========================= */

        .navbar1 {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
            border-bottom: 1px solid #ddd;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .logo1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
        }

        .links1 {
            display: flex;
            gap: 55px;
        }

        .links1 a {
            text-decoration: none;
            color: black;
        }

        .buttons1 {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .buttons1 a {
            text-decoration: none;
            color: black;
        }

        .buttons1 button {
            background-color: #171717;
            color: white;
            border: none;
            padding: 16px 25px;
            border-radius: 8px;
        }


        /* =========================
           BLUE BACKGROUND
        ========================= */

        .blue-section {
            background: linear-gradient(135deg, #4265b5, #171c5c);
            padding: 100px 0;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR 2 - FLOW DESKTOP
        ========================= */

        .navbar2 {
            width: 80%;
            height: 100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            padding: 0 30px;
            box-sizing: border-box;
        }

        .logo2 {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            font-size: 25px;
        }

        .circle {
            width: 35px;
            height: 35px;
            background: #75aaff;
            border-radius: 50%;
        }

        .links2 {
            display: flex;
            gap: 45px;
        }

        .links2 a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .signup {
            background: linear-gradient(90deg, #6dbfff, #8a8cff);
            color: white;
            border: none;
            padding: 20px 35px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 17px;
        }


        /* =========================
           NAVBAR 3 - FLOW MOBILE
        ========================= */

        .navbar3 {
            width: 35%;
            height: 100px;
            margin: 80px auto 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            padding: 0 35px;
            box-sizing: border-box;
        }

        .logo3 {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            font-size: 25px;
        }

        .menu {
            color: white;
            font-size: 35px;
        }


        /* =========================
           NAVBAR 4 - BLACK PILL
        ========================= */

        .black-section {
            background-color: #f7f7f7;
            padding: 200px 0;
            font-family: Arial, sans-serif;
        }

        .navbar4 {
            width: 85%;
            height: 70px;
            margin: auto;

            background-color: #181818;

            border: 6px solid #111;
            border-radius: 50px;

            display: flex;
            align-items: center;

            padding: 0 15px;
            box-sizing: border-box;

            box-shadow: 0 10px 20px #aaa;
        }

        .logo4 {
            width: 45px;
            height: 45px;

            background-color: white;
            color: black;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .links4 {
            display: flex;
            gap: 45px;
            margin-left: 45px;
        }

        .links4 a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .email {
            margin-left: auto;

            background-color: white;
            color: black;

            padding: 14px 25px;
            border-radius: 30px;

            font-size: 16px;
        }

    </style>

</head>


<body>


    <!-- =========================
         1. SHADCNBLOCKS NAVBAR
    ========================== -->

    <nav class="navbar1">

        <div class="logo1">
            <span>⬡</span>
            <b>Shadcnblocks.com</b>
        </div>

        <div class="links1">
            <a href="#">Products⌄</a>
            <a href="#">Company⌄</a>
            <a href="#">Contact</a>
        </div>

        <div class="buttons1">
            <a href="#">Log in</a>
            <button>Sign up</button>
        </div>

    </nav>



    <!-- =========================
         2 + 3. FLOW NAVBARS
    ========================== -->

    <section class="blue-section">

        <!-- FLOW DESKTOP NAVBAR -->

        <nav class="navbar2">

            <div class="logo2">
                <span class="circle"></span>
                <b>Flow</b>
            </div>

            <div class="links2">
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">Docs</a>
                <a href="#">Blog</a>
            </div>

            <button class="signup">
                Sign up
            </button>

        </nav>


        <!-- FLOW MOBILE NAVBAR -->

        <nav class="navbar3">

            <div class="logo3">
                <span class="circle"></span>
                <b>Flow</b>
            </div>

            <div class="menu">
                ☰
            </div>

        </nav>

    </section>



    <!-- =========================
         4. BLACK PILL NAVBAR
    ========================== -->

    <section class="black-section">

        <nav class="navbar4">

            <div class="logo4">
                ◉
            </div>

            <div class="links4">
                <a href="#">Work</a>
                <a href="#">About</a>
                <a href="#">Playground</a>
                <a href="#">Resource</a>
            </div>

            <div class="email">
                ihyaet@gmail.com
            </div>

        </nav>

    </section>


</body>
</html>
